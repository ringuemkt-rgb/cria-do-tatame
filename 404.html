<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>404 — CRIA DO TATAME</title>

    p{color:#bab8b1;line-height:1.7}
    a{display:inline-block;margin-top:18px;padding:13px 18px;border:1px solid #f2c230;color:#f4f0e7;text-decoration:none;font-weight:800;letter-spacing:.08em;background:#15130d}
    a:focus-visible{outline:3px solid #58c7d9;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">O TATAME NÃO ENCONTROU ESTA ROTA</div>

    <p>A página saiu da posição. Volte ao combate e continue a construir sua carreira no CRIA DO TATAME.</p>

</html>
