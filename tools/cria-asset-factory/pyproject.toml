[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cria-asset-factory"
version = "0.1.1"
description = "Offline candidate authoring tools for Cria do Tatame (not a runtime)"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.24,<3", "ffmpeg-python>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
