name: CriaLive V1

on:
  push:
    paths:
      - 'data/social/crialive_v1.json'
      - 'data/sponsors.json'
      - 'src/social/**'
      - 'src/autoloads/CriaLiveInteractionManager.gd'
      - 'src/autoloads/DataRegistry.gd'
      - 'src/autoloads/SignalBus.gd'
      - 'src/autoloads/WorldState.gd'
      - 'tools/social/validate_crialive_v1.py'
      - 'tests/crialive_v1_smoke.gd'
      - '.github/workflows/crialive-v1.yml'
  pull_request:
    paths:
      - 'data/social/crialive_v1.json'
      - 'data/sponsors.json'
      - 'src/social/**'
      - 'src/autoloads/CriaLiveInteractionManager.gd'
      - 'src/autoloads/DataRegistry.gd'
      - 'src/autoloads/SignalBus.gd'
      - 'src/autoloads/WorldState.gd'
      - 'tools/social/validate_crialive_v1.py'
      - 'tests/crialive_v1_smoke.gd'
      - '.github/workflows/crialive-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate CriaLive v1
        run: python tools/social/validate_crialive_v1.py

  godot-smoke:
    needs: static-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.2.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: timeout 180 ./godot --headless --editor --path . --import
      - name: Run CriaLive v1 smoke
        run: ./godot --headless --path . --script res://tests/crialive_v1_smoke.gd
