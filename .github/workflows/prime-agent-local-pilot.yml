name: Prime Agent Local Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prime-agent-local-pilot.yml'
      - '.criaforge/prompts/prime_agent_ruan_davi_v01.md'
      - 'tools/agents/prime_agent_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIME_AGENT_VERSION: '0.7.2'
  PRIME_AGENT_SHA256: 'bc5471f2a626d727b88a45eb745fff93b10c554a3c4fc5912f25d8c64b987f5e'
  LOCAL_MODEL: 'qwen2.5-coder:3b'

jobs:
  execute-local-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Prime Agent
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v${PRIME_AGENT_VERSION}/prime-agent-${PRIME_AGENT_VERSION}.tgz"
          curl -L --fail --retry 3 -o /tmp/prime-agent.tgz "$URL"
          echo "${PRIME_AGENT_SHA256}  /tmp/prime-agent.tgz" | sha256sum -c -
          npm install -g /tmp/prime-agent.tgz
          prime-agent --version

      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$LOCAL_MODEL"

      - name: Configure Prime Agent local provider
        shell: bash
        run: |
          mkdir -p "$HOME/.prime/agent"
          cat > "$HOME/.prime/agent/models.json" <<'JSON'
          {
            "providers": {
              "ollama": {
                "baseUrl": "http://127.0.0.1:11434/v1",
                "api": "openai-completions",
                "apiKey": "ollama",
                "compat": {
                  "supportsDeveloperRole": false,
                  "supportsReasoningEffort": false
                },
                "models": [
                  {
                    "id": "qwen2.5-coder:3b",
                    "name": "Qwen2.5-Coder 3B Local",
                    "reasoning": false,
                    "contextWindow": 32768,
                    "maxTokens": 8192
                  }
                ]
              }
            }
          }
          JSON

      - name: Execute Prime Agent on Ruan-Davi pilot
        id: prime
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports/prime_agent
          python tools/agents/prime_agent_adapter.py \
            --repo . \
            --prompt-file .criaforge/prompts/prime_agent_ruan_davi_v01.md \
            --model "$LOCAL_MODEL" \
            --gate "npm run quality" \
            --execute

      - name: Capture candidate diff
        if: always()
        shell: bash
        run: |
          mkdir -p reports/prime_agent
          git status --short > reports/prime_agent/git_status.txt
          git diff --binary > reports/prime_agent/candidate.patch
          git diff --name-only > reports/prime_agent/changed_files.txt

      - name: Enforce pilot scope
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('reports/prime_agent/changed_files.txt').read_text().splitlines() if x.strip()]
          allowed_runtime = {
              'src/autoloads/CombatManager.gd',
              'src/autoloads/MissionManager.gd',
              'src/combat/TechniqueClashResolver.gd',
              'src/autoloads/SaveManager.gd',
          }
          forbidden = [
              'project.godot',
              'src/autoloads/AudioManager.gd',
              'data/production/canon_contract_v4_1.json',
              'data/production/supreme_build_contract_v01.json',
          ]
          bad = [p for p in changed if p in forbidden or p.startswith('assets/aprovados/') or p.startswith('.github/workflows/')]
          runtime = [p for p in changed if p.startswith('src/')]
          assert not bad, f'forbidden paths changed: {bad}'
          assert len(runtime) <= 1, f'more than one runtime file changed: {runtime}'
          assert all(p in allowed_runtime for p in runtime), f'runtime outside allowlist: {runtime}'
          print({'changed': changed, 'runtime': runtime})
          PY

      - name: Validate candidate quality
        if: always()
        shell: bash
        run: npm run quality

      - name: Download Godot 4.2.2
        if: always()
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Validate candidate in Godot
        if: always()
        shell: bash
        run: |
          set -o pipefail
          timeout 180 ./godot --headless --editor --path . --import 2>&1 | tee reports/prime_agent/godot_import.log
          ./godot --headless --path . --script res://tests/runtime_smoke.gd 2>&1 | tee reports/prime_agent/runtime_smoke.log
          ./godot --headless --path . --script res://tests/full_game_smoke.gd 2>&1 | tee reports/prime_agent/full_game_smoke.log
          if grep -RInE "SCRIPT ERROR|Parse Error|Invalid call|Failed loading resource|Cannot get class" reports/prime_agent/godot_import.log reports/prime_agent/*smoke.log; then
            exit 1
          fi

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-agent-local-ruan-davi
          path: reports/prime_agent/
          if-no-files-found: warn

      - name: Require clean agent completion
        if: always()
        shell: bash
        run: |
          test -f reports/prime_agent/report.json
          python - <<'PY'
          import json
          report = json.load(open('reports/prime_agent/report.json', encoding='utf-8'))
          assert report['status'] == 'COMPLETED', report
          assert report['l4'] == 'PENDING_HUMAN', report
          assert not report['policy_violations'], report
          print({'status': report['status'], 'l4': report['l4']})
          PY
