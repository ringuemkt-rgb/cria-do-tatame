name: Deck V2 preset uniqueness
on:
  pull_request:
    paths:
      - 'src/autoloads/DeckManager.gd'
      - 'tests/deck_v2_preset_unique_smoke.gd'
      - 'tests/deck_v2_preset_load_smoke.gd'
      - '.github/workflows/deck-v2-preset-unique-smoke.yml'
  workflow_dispatch:
jobs:
  deck-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Preset transactional regression
        run: godot --headless --path . --script res://tests/deck_v2_preset_unique_smoke.gd
      - name: Saved preset validation regression
        run: godot --headless --path . --script res://tests/deck_v2_preset_load_smoke.gd
