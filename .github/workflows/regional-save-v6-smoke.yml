name: Regional save v6 regression
on:
  pull_request:
    paths:
      - 'src/autoloads/SaveManager.gd'
      - 'src/autoloads/WorldMapManager.gd'
      - 'tests/regional_save_v6_persistence_smoke.gd'
      - '.github/workflows/regional-save-v6-smoke.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight audit dependencies
        run: python -m pip install Pillow
      - name: Complete repository quality gate
        run: npm run quality
  regional-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import Godot project
        run: godot --headless --editor --path . --quit
      - name: Check regional save migrations
        run: godot --headless --path . --script res://tests/regional_save_v6_persistence_smoke.gd
