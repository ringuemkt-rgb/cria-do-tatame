name: Phase 0 Retro Manifest

on:
  push:
    branches:
      - cmd/phase0-cleanup

permissions:
  contents: write

jobs:
  retro-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run retro manifest
        run: python tools/art/retro_manifest.py

      - name: Verify generated coverage
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('reports/repo/retro_manifest_report.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(d, indent=2, ensure_ascii=False))
          assert d['coverage_percent'] == 100.0
          assert not d['missing_from_manifest']
          assert d['shipping_true_count'] == 0
          PY

      - name: Commit generated retro sidecars and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/manifest_v2.json reports/repo/retro_manifest_report.json
          git add --all ':/**/*.provenance.json' ':/**/*.license.json' || true
          git add --all
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore(repo): retro-index historical binaries [skip ci]'
          git push origin HEAD:cmd/phase0-cleanup
